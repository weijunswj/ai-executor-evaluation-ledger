name: Controller ledger maintenance infrastructure

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  build:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'controller/ledger-run078-evaluation-079-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out controller branch
        uses: actions/checkout@v4
        with:
          ref: controller/ledger-run078-evaluation-079-r2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install jsonschema

      - name: Verify controller history anchor
        shell: bash
        run: |
          test "$(git rev-parse c60d64f4bddf531df761db5ddf30ab5b44e70575^{tree})" = "92908427a0527cc0ffa207cdc130b6b79eff3d1e"
          test "$(git rev-parse adf98bf335cd95f863aafe52e6b8f749ca3999bf^{tree})" = "92908427a0527cc0ffa207cdc130b6b79eff3d1e"
          test "$(git rev-parse 2d4ec54c4a922ee37d0ae53a52a9c97732fb76d8^{tree})" = "92908427a0527cc0ffa207cdc130b6b79eff3d1e"
          for sha in \
            90c75c00192fbb759a5c756b697cb3d7cfc7dab1 \
            45990433a0f8199f056d1ad71a51f934b3bae7aa \
            223e6ecc24c84421a4bab60fcf87472b1d620744 \
            d54fb99da162f49ccb616a8756725b9aea83ac1d \
            180e3c1ea57ccd45ca2c71a76ebe4c3d609e2c0b
          do
            git cat-file -e "${sha}^{commit}"
            git merge-base --is-ancestor "$sha" 2d4ec54c4a922ee37d0ae53a52a9c97732fb76d8
          done

      - name: Apply bounded infrastructure patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          historical_step = '''      - name: Fetch immutable PR 151 historical authority
            shell: bash
            env:
              HISTORICAL_AUTHORITY_REF: refs/pull/151/head
              HISTORICAL_AUTHORITY_SHA: 2d4ec54c4a922ee37d0ae53a52a9c97732fb76d8
              HISTORICAL_AUTHORITY_TARGET: refs/remotes/origin/ledger-pr-151-authority
            run: |
              head_before=$(git rev-parse --verify HEAD)

              git fetch \\
                --no-tags \\
                --no-recurse-submodules \\
                origin \\
                "${HISTORICAL_AUTHORITY_REF}:${HISTORICAL_AUTHORITY_TARGET}"

              actual=$(git rev-parse --verify "${HISTORICAL_AUTHORITY_TARGET}^{commit}")
              test "$actual" = "$HISTORICAL_AUTHORITY_SHA"

              for sha in \\
                90c75c00192fbb759a5c756b697cb3d7cfc7dab1 \\
                45990433a0f8199f056d1ad71a51f934b3bae7aa \\
                223e6ecc24c84421a4bab60fcf87472b1d620744 \\
                d54fb99da162f49ccb616a8756725b9aea83ac1d \\
                180e3c1ea57ccd45ca2c71a76ebe4c3d609e2c0b
              do
                git cat-file -e "${sha}^{commit}"
                git merge-base --is-ancestor "$sha" "$actual"
              done

              test "$(git rev-parse --verify HEAD)" = "$head_before"
              test -z "$(git status --porcelain)"

'''

          for workflow in (".github/workflows/ci.yml", ".github/workflows/public-safety.yml"):
              replace_once(
                  workflow,
                  "      - name: Install dependencies\n",
                  historical_step + "      - name: Install dependencies\n",
              )

          replace_once(
              ".github/workflows/ci.yml",
              '''        env:
              EVENT_NAME: ${{ github.event_name }}
              REF_NAME: ${{ github.ref_name }}
              HEAD_SHA: ${{ steps.authority.outputs.head_sha }}
              GH_TOKEN: ${{ github.token }}
            run: |
              mode=pr
              if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
                mode=canonical-main
              fi
              args=(python scripts/validate_receipts.py --mode "$mode" --authority-sha "$HEAD_SHA" --validation-level source-replay)
              "${args[@]}"
''',
              '''        env:
              EVENT_NAME: ${{ github.event_name }}
              REF_NAME: ${{ github.ref_name }}
              HEAD_REF: ${{ github.head_ref }}
              HEAD_SHA: ${{ steps.authority.outputs.head_sha }}
              BASE_SHA: ${{ steps.authority.outputs.base_sha }}
              GH_TOKEN: ${{ github.token }}
            run: |
              mode=pr
              if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
                mode=canonical-main
              elif [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == controller/evaluation-* ]]; then
                expected=$(printf '%s\\n' README.md analysis/model-recommendation.json evaluations.jsonl scorecard.md | sort)
                actual=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
                test "$actual" = "$expected"
                mode=canonical-main
              fi
              args=(python scripts/validate_receipts.py --mode "$mode" --authority-sha "$HEAD_SHA" --validation-level source-replay)
              if [[ "$mode" == "canonical-main" ]]; then
                args+=(--canonical-base-sha "$BASE_SHA")
              fi
              "${args[@]}"
''',
          )

          replace_once(
              ".github/workflows/public-safety.yml",
              '''        env:
              EVENT_NAME: ${{ github.event_name }}
              HEAD_SHA: ${{ steps.authority.outputs.head_sha }}
              GH_TOKEN: ${{ github.token }}
            run: |
              mode=pr
              if [[ "$EVENT_NAME" == "push" ]]; then
                mode=canonical-main
              fi
              args=(python scripts/validate_receipts.py --mode "$mode" --authority-sha "$HEAD_SHA" --validation-level source-replay)
              "${args[@]}"
''',
              '''        env:
              EVENT_NAME: ${{ github.event_name }}
              HEAD_REF: ${{ github.head_ref }}
              HEAD_SHA: ${{ steps.authority.outputs.head_sha }}
              BASE_SHA: ${{ steps.authority.outputs.base_sha }}
              GH_TOKEN: ${{ github.token }}
            run: |
              mode=pr
              if [[ "$EVENT_NAME" == "push" ]]; then
                mode=canonical-main
              elif [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == controller/evaluation-* ]]; then
                expected=$(printf '%s\\n' README.md analysis/model-recommendation.json evaluations.jsonl scorecard.md | sort)
                actual=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
                test "$actual" = "$expected"
                mode=canonical-main
              fi
              args=(python scripts/validate_receipts.py --mode "$mode" --authority-sha "$HEAD_SHA" --validation-level source-replay)
              if [[ "$mode" == "canonical-main" ]]; then
                args+=(--canonical-base-sha "$BASE_SHA")
              fi
              "${args[@]}"
''',
          )

          replace_once(
              "scripts/validate_receipts.py",
              '''def validate_all_tracked_batch_receipts(
              root: Path,
              *,
              authority_sha: str,
              mode: str,
          ) -> dict[str, Any]:
              authority_sha = resolve_commit(root, authority_sha)
              schema = _load_schema(root)
''',
              '''def validate_all_tracked_batch_receipts(
              root: Path,
              *,
              authority_sha: str,
              mode: str,
              canonical_base_sha: Optional[str] = None,
          ) -> dict[str, Any]:
              authority_sha = resolve_commit(root, authority_sha)
              if mode not in {"pr", "canonical-main"}:
                  raise ReceiptValidationError("receipt_invalid_mode")
              canonical_base = (
                  resolve_commit(root, canonical_base_sha)
                  if mode == "canonical-main" and canonical_base_sha is not None
                  else None
              )
              schema = _load_schema(root)
''',
          )

          replace_once(
              "scripts/validate_receipts.py",
              '''        _validate_terminal_seal_scope(
                  root,
                  seal_sha=seal_sha,
                  receipt_path=path,
                  candidate_sha=candidate_sha,
              )
''',
              '''        _validate_terminal_seal_scope(
                  root,
                  seal_sha=seal_sha,
                  receipt_path=path,
                  candidate_sha=candidate_sha,
                  mode=mode,
                  authority_sha=authority_sha,
                  canonical_base_sha=(
                      canonical_base
                      if mode == "canonical-main" and seal_sha == authority_sha
                      else None
                  ),
              )
              if mode == "canonical-main":
                  _validate_content_at_commit(root, seal_sha, receipt)
''',
          )

          replace_once(
              "scripts/validate_receipts.py",
              '''def _validate_terminal_seal_scope(
              root: Path,
              *,
              seal_sha: str,
              receipt_path: str,
              candidate_sha: str,
          ) -> None:
              parent_line = str(
                  _git(root, "rev-list", "--parents", "-n", "1", seal_sha, text=True)
              ).strip().split()
              if len(parent_line) != 2 or parent_line[1] != candidate_sha:
                  raise ReceiptValidationError("receipt_candidate_parent_mismatch")
              changed = str(
                  _git(
                      root,
                      "diff-tree",
                      "--no-commit-id",
                      "--name-only",
                      "-r",
                      candidate_sha,
                      seal_sha,
                      text=True,
                  )
              ).splitlines()
              if changed != [receipt_path]:
                  raise ReceiptValidationError("receipt_final_commit_scope")
''',
              '''def _validate_terminal_seal_scope(
              root: Path,
              *,
              seal_sha: str,
              receipt_path: str,
              candidate_sha: str,
              mode: str = "pr",
              authority_sha: Optional[str] = None,
              canonical_base_sha: Optional[str] = None,
          ) -> None:
              parent_line = str(
                  _git(root, "rev-list", "--parents", "-n", "1", seal_sha, text=True)
              ).strip().split()
              if len(parent_line) != 2:
                  raise ReceiptValidationError("receipt_final_head_parent_count")
              if mode == "pr":
                  if parent_line[1] != candidate_sha:
                      raise ReceiptValidationError("receipt_candidate_parent_mismatch")
              elif mode == "canonical-main":
                  if (
                      canonical_base_sha is not None
                      and authority_sha == seal_sha
                      and parent_line[1] != canonical_base_sha
                  ):
                      raise ReceiptValidationError("receipt_terminal_parent_mismatch")
              else:
                  raise ReceiptValidationError("receipt_invalid_mode")
              changed = str(
                  _git(
                      root,
                      "diff-tree",
                      "--no-commit-id",
                      "--name-only",
                      "-r",
                      candidate_sha,
                      seal_sha,
                      text=True,
                  )
              ).splitlines()
              if changed != [receipt_path]:
                  raise ReceiptValidationError("receipt_final_commit_scope")
''',
          )

          replace_once(
              "scripts/validate_receipts.py",
              '''def validate_source_replay(
              root: Path,
              *,
              authority_sha: str,
              mode: str,
          ) -> dict[str, Any]:
''',
              '''def validate_source_replay(
              root: Path,
              *,
              authority_sha: str,
              mode: str,
              canonical_base_sha: Optional[str] = None,
          ) -> dict[str, Any]:
''',
          )
          replace_once(
              "scripts/validate_receipts.py",
              '''    structural = validate_all_tracked_batch_receipts(
                  root,
                  authority_sha=authority_sha,
                  mode=mode,
              )
''',
              '''    structural = validate_all_tracked_batch_receipts(
                  root,
                  authority_sha=authority_sha,
                  mode=mode,
                  canonical_base_sha=canonical_base_sha,
              )
''',
          )
          replace_once(
              "scripts/validate_receipts.py",
              '''    parser.add_argument("--authority-sha", default="HEAD")
              parser.add_argument(
''',
              '''    parser.add_argument("--authority-sha", default="HEAD")
              parser.add_argument("--canonical-base-sha")
              parser.add_argument(
''',
          )
          replace_once(
              "scripts/validate_receipts.py",
              '''                authority_sha=args.authority_sha,
                      mode=args.mode,
                  )
''',
              '''                authority_sha=args.authority_sha,
                      mode=args.mode,
                      canonical_base_sha=args.canonical_base_sha,
                  )
''',
          )
          replace_once(
              "scripts/validate_receipts.py",
              '''                authority_sha=args.authority_sha,
                      mode=args.mode,
                  )
              except ReceiptValidationError:
''',
              '''                authority_sha=args.authority_sha,
                      mode=args.mode,
                      canonical_base_sha=args.canonical_base_sha,
                  )
              except ReceiptValidationError:
''',
          )

          replace_once(
              "tests/test_dl153009_amendment.py",
              '                self.assertNotIn("refs/pull/", workflow)\n',
              '''                checkout_uses = workflow.index("uses: actions/checkout@v4")
                          checkout_start = workflow.rfind("- name:", 0, checkout_uses)
                          checkout_end = workflow.find("\\n      - name:", checkout_start + 1)
                          checkout_step = workflow[checkout_start:checkout_end]
                          self.assertNotIn("refs/pull/", checkout_step)
                          historical_ref = "refs/pull/151/head"
                          self.assertEqual(1, workflow.count(historical_ref))
                          self.assertIn("Fetch immutable PR 151 historical authority", workflow)
                          self.assertIn("2d4ec54c4a922ee37d0ae53a52a9c97732fb76d8", workflow)
                          self.assertIn("refs/remotes/origin/ledger-pr-151-authority", workflow)
                          self.assertNotIn("refs/pull/*", workflow)
                          self.assertNotIn("+refs/pull/*", workflow)
''',
          )
          replace_once(
              "tests/test_dl153009_amendment.py",
              '            evidence = validate_source_replay(ROOT, authority_sha=head, mode="pr")\n',
              '            evidence = validate_source_replay(ROOT, authority_sha=head, mode="canonical-main")\n',
          )

          insertion = '''
              def test_controller_evaluation_receipt_mode_is_exact_scope_only(self):
                  required = (
                      "README.md",
                      "analysis/model-recommendation.json",
                      "evaluations.jsonl",
                      "scorecard.md",
                  )
                  for relative in (".github/workflows/ci.yml", ".github/workflows/public-safety.yml"):
                      with self.subTest(workflow=relative):
                          workflow = (ROOT / relative).read_text(encoding="utf-8")
                          self.assertIn('"$HEAD_REF" == controller/evaluation-*', workflow)
                          self.assertIn('mode=canonical-main', workflow)
                          self.assertIn('--canonical-base-sha "$BASE_SHA"', workflow)
                          for path in required:
                              self.assertIn(path, workflow)
                          self.assertIn('git diff --name-only "$BASE_SHA" "$HEAD_SHA"', workflow)

          '''
          marker = '    def test_pull_request_uses_literal_head_not_synthetic_merge(self):\n'
          test_path = Path("tests/test_dl153009_amendment.py")
          test_text = test_path.read_text(encoding="utf-8")
          if test_text.count(marker) != 1:
              raise SystemExit("controller evaluation test insertion marker mismatch")
          test_path.write_text(test_text.replace(marker, insertion + marker), encoding="utf-8", newline="\n")

          squash_test = '''
              def test_canonical_main_accepts_squash_tree_and_rejects_wrong_base(self):
                  self.append_batch(1)
                  _path, _candidate, second_seal = self.append_batch(2)
                  base = self.seals[0]
                  tree = git(self.root, "rev-parse", f"{second_seal}^{{tree}}")
                  squash = git(
                      self.root,
                      "commit-tree",
                      tree,
                      "-p",
                      base,
                      "-m",
                      "synthetic squash",
                  )
                  evidence = validate_all_tracked_batch_receipts(
                      self.root,
                      authority_sha=squash,
                      mode="canonical-main",
                      canonical_base_sha=base,
                  )
                  self.assertEqual(2, evidence["receipt_count"])
                  with self.assertRaises(ReceiptValidationError):
                      validate_all_tracked_batch_receipts(
                          self.root,
                          authority_sha=squash,
                          mode="canonical-main",
                          canonical_base_sha=self.candidates[-1],
                      )

          '''
          marker = '    def test_historical_receipt_bytes_and_hashes_are_not_compared_to_later_canonical_bytes(self):\n'
          test_text = test_path.read_text(encoding="utf-8")
          if test_text.count(marker) != 1:
              raise SystemExit("squash test insertion marker mismatch")
          test_path.write_text(test_text.replace(marker, squash_test + marker), encoding="utf-8", newline="\n")
          PY

      - name: Validate infrastructure candidate before commit
        shell: bash
        env:
          BASE_REF: adf98bf335cd95f863aafe52e6b8f749ca3999bf
        run: |
          python -m unittest tests.test_dl153009_amendment
          python -m unittest discover -s tests
          python scripts/rebuild_views.py --check --base-ref "$BASE_REF"
          python scripts/validate_manifests.py --base-ref "$BASE_REF"
          python scripts/check_public_safety.py
          git diff --check

      - name: Commit bounded infrastructure candidate
        id: candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'ledger-controller'
          git add .github/workflows/ci.yml .github/workflows/public-safety.yml scripts/validate_receipts.py tests/test_dl153009_amendment.py
          git rm .github/workflows/controller-append-run078-evaluation.yml
          git diff --cached --check
          git commit -m 'Repair controller ledger validation path'
          candidate=$(git rev-parse HEAD)
          expected=$(printf '%s\n' .github/workflows/ci.yml .github/workflows/public-safety.yml scripts/validate_receipts.py tests/test_dl153009_amendment.py | sort)
          actual=$(git diff --name-only adf98bf335cd95f863aafe52e6b8f749ca3999bf "$candidate" | sort)
          test "$actual" = "$expected"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

      - name: Reseal frozen batch against infrastructure candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          python scripts/seal_batch_receipt.py --candidate-content-commit-sha "$CANDIDATE_SHA"
          git add ledger/receipts/batches/batch-20260729-gate3-amendment-004.json
          git diff --cached --check
          git commit -m 'Reseal controller infrastructure candidate'
          terminal=$(git rev-parse HEAD)
          test "$(git diff --name-only "$CANDIDATE_SHA" "$terminal")" = "ledger/receipts/batches/batch-20260729-gate3-amendment-004.json"

      - name: Validate exact terminal seal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: adf98bf335cd95f863aafe52e6b8f749ca3999bf
        run: |
          python -m unittest discover -s tests
          python scripts/rebuild_views.py --check --base-ref "$BASE_REF"
          python scripts/validate_manifests.py --base-ref "$BASE_REF"
          python scripts/check_public_safety.py
          python scripts/validate_receipts.py --mode pr --authority-sha HEAD --validation-level source-replay
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Push candidate and terminal together
        run: git push origin HEAD:controller/ledger-run078-evaluation-079-r2
