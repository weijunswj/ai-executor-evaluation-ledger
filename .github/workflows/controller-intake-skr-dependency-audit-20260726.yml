name: Finalize SKR dependency audit evaluation 20260726

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/controller_intake_skr_dependency_audit_20260726.py

permissions:
  contents: write

concurrency:
  group: controller-skr-dependency-audit-20260726
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'controller/trigger-skr-dependency-audit-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify final branch is absent
        shell: bash
        run: |
          set -euo pipefail
          final_branch='controller/final-skr-dependency-audit-20260726'
          if git ls-remote --exit-code --heads origin "refs/heads/${final_branch}" >/dev/null 2>&1; then
            echo 'Final branch already exists; refusing duplicate publication.' >&2
            exit 1
          fi

      - name: Create final branch from current main
        run: git switch -c controller/final-skr-dependency-audit-20260726 origin/main

      - name: Append reviewed evaluation record
        run: python scripts/controller_intake_skr_dependency_audit_20260726.py

      - name: Remove temporary intake authority
        run: git rm -- scripts/controller_intake_skr_dependency_audit_20260726.py .github/workflows/controller-intake-skr-dependency-audit-20260726.yml

      - name: Rebuild deterministic views
        run: python scripts/rebuild_views.py

      - name: Run public-safety scan
        run: python scripts/check_public_safety.py

      - name: Verify append-only source and generated views
        run: |
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check

      - name: Verify exact evaluation identity and result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          run_id = '2026-07-26-gpt-5-6-sol-public-web-app-a-production-dependency-audit-005'
          records = [
              json.loads(line)
              for line in Path('evaluations.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          matches = [record for record in records if record.get('run_id') == run_id]
          if len(matches) != 1:
              raise SystemExit(f'Expected one record for {run_id}, found {len(matches)}')
          record = matches[0]
          actual = (
              record.get('model'),
              record.get('outcome'),
              record.get('weighted_score_5'),
          )
          expected = ('GPT-5.6 Sol', 'accepted', 4.70)
          if actual != expected:
              raise SystemExit(f'Identity or result mismatch for {run_id}: {actual!r}')
          if 'requested_reasoning_level' in record or 'observed_reasoning_mode' in record:
              raise SystemExit('Public record must remain base-model-only without reasoning fields')
          PY
          test ! -e scripts/controller_intake_skr_dependency_audit_20260726.py
          test ! -e .github/workflows/controller-intake-skr-dependency-audit-20260726.yml

      - name: Publish validated final branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'ledger-controller'
          git add -A
          git commit -m 'Record SKR production dependency audit evaluation'
          git push origin HEAD:controller/final-skr-dependency-audit-20260726
