name: Finalize DeepSeek governance reset evaluation

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: read

concurrency:
  group: controller-deepseek-governance-reset
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.issue.number == 43 && contains(github.event.comment.body, '[run-deepseek-governance-reset]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build clean final evaluation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          if git ls-remote --exit-code --heads origin refs/heads/controller/final-deepseek-governance-reset-20260726 >/dev/null 2>&1; then
            echo "Final evaluation branch already exists; refusing duplicate publication." >&2
            exit 1
          fi

          git switch -c controller/final-deepseek-governance-reset-20260726 origin/main

          python scripts/controller_append_deepseek_governance_reset.py

          rm scripts/controller_append_deepseek_governance_reset.py
          rm .github/workflows/controller-deepseek-governance-reset.yml
          rm scripts/controller_deepseek_governance_reset.trigger

          python scripts/rebuild_views.py
          python scripts/check_public_safety.py
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check

          test "$(grep -c '2026-07-26-deepseek-v4-pro-governance-tooling-a-architecture-reset-001' evaluations.jsonl)" -eq 1
          test ! -e scripts/controller_append_deepseek_governance_reset.py
          test ! -e .github/workflows/controller-deepseek-governance-reset.yml
          test ! -e scripts/controller_deepseek_governance_reset.trigger

          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add -A
          git commit -m "Record DeepSeek governance architecture reset evaluation"
          git push origin HEAD:controller/final-deepseek-governance-reset-20260726
