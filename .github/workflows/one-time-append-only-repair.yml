name: One-time append-only repair

on:
  push:
    branches:
      - controller/reconcile-two-pending-runs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller/reconcile-two-pending-runs
          fetch-depth: 0
      - name: Restore exact legacy evaluation bytes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('evaluations.jsonl')
          text = path.read_text(encoding='utf-8')
          old = 'introduced a truthful deployment-source mode instead of pretending a checkout was inspected'
          new = 'introduced a truthful deployment-source provenance mode instead of pretending a checkout was inspected'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy phrase, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          python scripts/rebuild_views.py
          rm .github/workflows/one-time-append-only-repair.yml
      - name: Commit repaired source and generated views
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Restore exact append-only source bytes"
          git push origin HEAD:controller/reconcile-two-pending-runs
