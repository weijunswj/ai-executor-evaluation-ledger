name: Controller intake — DeepSeek governance reset 005 final

on:
  push:
    branches:
      - controller/intake-deepseek-governance-reset-005-final

permissions:
  contents: write

concurrency:
  group: controller-intake-deepseek-governance-reset-005-final
  cancel-in-progress: false

jobs:
  intake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out intake branch
        uses: actions/checkout@v4
        with:
          ref: controller/intake-deepseek-governance-reset-005-final
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Append evaluation and rebuild views
        run: python scripts/controller_intake_deepseek_governance_reset_005_final.py
