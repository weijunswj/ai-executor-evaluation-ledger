name: CI Integrated Ledger Validation

on:
  push:
    branches:
      - main
      - "gemini/**"
      - "controller/**"
  pull_request:
    branches:
      - main
      - "gemini/**"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable 40-character lowercase base commit SHA
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable workflow authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable checkout and base authority
        id: authority
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_AUTHORITY_SHA: ${{ github.sha }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          args=(
            python scripts/resolve_workflow_authority.py
            --repository-root .
            --event-name "$EVENT_NAME"
            --github-sha "$GITHUB_AUTHORITY_SHA"
            --checkout-sha "$CHECKOUT_SHA"
            --pr-head-sha "$PR_HEAD_SHA"
            --pr-base-sha "$PR_BASE_SHA"
            --before-sha "$BEFORE_SHA"
            --dispatch-base-sha "$DISPATCH_BASE_SHA"
            --output-file "$GITHUB_OUTPUT"
          )
          "${args[@]}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run complete unit test suite
        run: python -m unittest discover -s tests

      - name: Verify deterministic append-only view rebuild twice
        env:
          BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: |
          python scripts/rebuild_views.py --check --base-ref "$BASE_SHA"
          python scripts/rebuild_views.py --check --base-ref "$BASE_SHA"

      - name: Run Public Safety Scan
        run: python scripts/check_public_safety.py

      - name: Validate closed migration manifests
        env:
          BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: python scripts/validate_manifests.py --base-ref "$BASE_SHA"

      - name: Validate immutable batch receipt seals
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ steps.authority.outputs.head_sha }}
          BASE_SHA: ${{ steps.authority.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=pr
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            mode=canonical-main
          fi
          args=(python scripts/validate_receipts.py --mode "$mode" --authority-sha "$HEAD_SHA" --canonical-base-sha "$BASE_SHA" --validation-level source-replay)
          "${args[@]}"

      - name: Git diff whitespace check
        run: git diff --check
