name: CI Integrated Ledger Validation

on:
  push:
    branches:
      - main
      - "gemini/**"
      - "controller/**"
  pull_request:
    branches:
      - main
      - "gemini/**"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable 40-character lowercase base commit SHA
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable workflow authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable checkout and base authority
        id: authority
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_AUTHORITY_SHA: ${{ github.sha }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          args=(
            python scripts/resolve_workflow_authority.py
            --repository-root .
            --event-name "$EVENT_NAME"
            --github-sha "$GITHUB_AUTHORITY_SHA"
            --checkout-sha "$CHECKOUT_SHA"
            --pr-head-sha "$PR_HEAD_SHA"
            --pr-base-sha "$PR_BASE_SHA"
            --before-sha "$BEFORE_SHA"
            --dispatch-base-sha "$DISPATCH_BASE_SHA"
            --output-file "$GITHUB_OUTPUT"
          )
          "${args[@]}"

      - name: Fetch immutable PR 151 historical authority
        shell: bash
        env:
          HISTORICAL_AUTHORITY_REF: refs/pull/151/head
          HISTORICAL_AUTHORITY_SHA: 2d4ec54c4a922ee37d0ae53a52a9c97732fb76d8
          HISTORICAL_AUTHORITY_TARGET: refs/remotes/origin/ledger-pr-151-authority
        run: |
          head_before=$(git rev-parse --verify HEAD)

          git fetch \
            --no-tags \
            --no-recurse-submodules \
            origin \
            "${HISTORICAL_AUTHORITY_REF}:${HISTORICAL_AUTHORITY_TARGET}"

          actual=$(git rev-parse --verify "${HISTORICAL_AUTHORITY_TARGET}^{commit}")
          test "$actual" = "$HISTORICAL_AUTHORITY_SHA"

          for sha in \
            90c75c00192fbb759a5c756b697cb3d7cfc7dab1 \
            45990433a0f8199f056d1ad71a51f934b3bae7aa \
            223e6ecc24c84421a4bab60fcf87472b1d620744 \
            d54fb99da162f49ccb616a8756725b9aea83ac1d \
            180e3c1ea57ccd45ca2c71a76ebe4c3d609e2c0b
          do
            git cat-file -e "${sha}^{commit}"
            git merge-base --is-ancestor "$sha" "$actual"
          done

          test "$(git rev-parse --verify HEAD)" = "$head_before"
          test -z "$(git status --porcelain)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run complete unit test suite
        run: python -m unittest discover -s tests

      - name: Verify deterministic append-only view rebuild twice
        env:
          BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: |
          python scripts/rebuild_views.py --check --base-ref "$BASE_SHA"
          python scripts/rebuild_views.py --check --base-ref "$BASE_SHA"

      - name: Run Public Safety Scan
        run: python scripts/check_public_safety.py

      - name: Validate closed migration manifests
        env:
          BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: python scripts/validate_manifests.py --base-ref "$BASE_SHA"

      - name: Validate immutable batch receipt seals
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ steps.authority.outputs.head_sha }}
          BASE_SHA: ${{ steps.authority.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=pr
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            mode=canonical-main
          fi
          args=(python scripts/validate_receipts.py --mode "$mode" --authority-sha "$HEAD_SHA" --canonical-base-sha "$BASE_SHA" --validation-level source-replay)
          "${args[@]}"

      - name: Git diff whitespace check
        run: git diff --check
