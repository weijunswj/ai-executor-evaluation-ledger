name: CI Integrated Ledger Validation

on:
  push:
    branches:
      - main
      - "gemini/**"
      - "controller/**"
  pull_request:
    branches:
      - main
      - "gemini/**"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run complete unit test suite
        run: |
          python -m unittest discover -s tests

      - name: Verify deterministic view rebuild twice
        run: |
          python scripts/rebuild_views.py --check
          python scripts/rebuild_views.py --check

      - name: Run Public Safety Scan
        run: |
          python scripts/check_public_safety.py

      - name: Validate closed migration manifests
        run: python scripts/validate_manifests.py

      - name: Validate immutable batch receipt seals
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RAW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/validate_receipts.py --mode pr --authority-sha "$RAW_HEAD_SHA" --validation-level source-replay
          elif [[ "$REF_NAME" == "main" ]]; then
            python scripts/validate_receipts.py --mode canonical-main --authority-sha "$PUSH_SHA" --validation-level source-replay
          else
            python scripts/validate_receipts.py --mode pr --authority-sha "$PUSH_SHA" --validation-level source-replay
          fi

      - name: Git diff whitespace check
        run: |
          git diff --check
