name: Public safety

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Diagnostic ledger validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose ledger state
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          git clone --quiet --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git fetch --quiet origin "$MERGE_SHA"
          git checkout --quiet --detach "$MERGE_SHA"
          python3 scripts/rebuild_views.py --check --base-ref "$BASE_SHA"
          python3 scripts/check_public_safety.py
