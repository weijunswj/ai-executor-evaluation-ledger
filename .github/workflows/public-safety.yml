name: Public safety

# Controller evaluation intake is transformed only by the CI transport on its initial same-repository PR opening; this workflow validates the resulting canonical four-file head.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable 40-character lowercase base commit SHA
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: public-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan public ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out immutable workflow authority with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable checkout and base authority
        id: authority
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_AUTHORITY_SHA: ${{ github.sha }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          args=(
            python scripts/resolve_workflow_authority.py
            --repository-root .
            --event-name "$EVENT_NAME"
            --github-sha "$GITHUB_AUTHORITY_SHA"
            --checkout-sha "$CHECKOUT_SHA"
            --pr-head-sha "$PR_HEAD_SHA"
            --pr-base-sha "$PR_BASE_SHA"
            --before-sha "$BEFORE_SHA"
            --dispatch-base-sha "$DISPATCH_BASE_SHA"
            --output-file "$GITHUB_OUTPUT"
          )
          "${args[@]}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run safety code suite or bounded evaluation-data regression
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ steps.authority.outputs.head_sha }}
          BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: |
          data_only_evaluation=false
          expected=$(printf '%s\n' README.md analysis/model-recommendation.json evaluations.jsonl scorecard.md | sort)
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == controller/evaluation-* ]]; then
            actual=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
            if [[ "$actual" == "$expected" ]]; then
              data_only_evaluation=true
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            actual=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
            if [[ "$actual" == "$expected" ]]; then
              data_only_evaluation=true
            fi
          fi
          if [[ "$data_only_evaluation" == true ]]; then
            python -m unittest tests.test_controller_maintenance
          elif [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == "controller/ledger-maintenance-086-luna-evaluation-schema" ]] || [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" && "$BASE_SHA" == "da55c6ce1e3426b9b5eadfcb29fe41d8ce71e898" ]]; then
            schema_expected=$(printf '%s\n' .github/workflows/ci.yml .github/workflows/public-safety.yml schema/evaluation.schema.json | sort)
            schema_actual=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
            test "$schema_actual" = "$schema_expected"
            python -m unittest tests.test_controller_maintenance
            python - <<'PY'
          import copy
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path('schema/evaluation.schema.json').read_text(encoding='utf-8'))
          validator = jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker())
          validator.check_schema(schema)
          for line in Path('evaluations.jsonl').read_text(encoding='utf-8').splitlines():
              validator.validate(json.loads(line))

          scores = {
              'correctness': 4.0,
              'safety_and_scope_control': 4.0,
              'evidence_quality': 4.0,
              'operational_judgement': 4.0,
              'task_understanding': 4.0,
              'tracker_and_repository_hygiene': 4.0,
              'autonomy': 4.0,
              'efficiency': 4.0,
          }
          probe = {
              'schema_version': 2,
              'record_type': 'evaluation',
              'run_id': 'schema-probe-luna-evaluation',
              'reviewed_at': '2026-08-11T00:00:00Z',
              'provider': 'OpenAI',
              'model': 'GPT-5.6 Luna',
              'evaluation_protocol': 'gated_v1',
              'task_class': 'research',
              'difficulty': 'low',
              'subject_alias': 'schema-probe',
              'revision_binding': 'non-identifying-schema-probe',
              'outcome': 'hold',
              'first_pass_accepted': False,
              'controller_intervention_required': True,
              'scores': scores,
              'weighted_score_5': 4.0,
              'confidence': 'anecdotal',
          }
          validator.validate(probe)
          sol_probe = copy.deepcopy(probe)
          sol_probe['run_id'] = 'schema-probe-sol-evaluation'
          sol_probe['model'] = 'GPT-5.6 Sol'
          validator.validate(sol_probe)
          correction_probe = copy.deepcopy(probe)
          correction_probe.update({
              'record_type': 'correction',
              'run_id': 'schema-probe-luna-correction',
              'affected_run_id': 'schema-probe-luna-evaluation',
              'corrected_fields': {'weighted_score_5': 4.0},
              'correction_reason': 'schema probe',
              'correction_scope': 'schema probe',
              'verification_evidence': 'schema probe',
          })
          validator.validate(correction_probe)
          bad_probe = copy.deepcopy(probe)
          bad_probe['run_id'] = 'schema-probe-invalid-provider-pair'
          bad_probe['provider'] = 'DeepSeek'
          try:
              validator.validate(bad_probe)
          except jsonschema.ValidationError:
              pass
          else:
              raise SystemExit('Luna provider/model pair failed closed-schema isolation')
          PY
          elif [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == controller/ledger-maintenance-* ]]; then
            GITHUB_EVENT_NAME=push GITHUB_REF_NAME=main python -m unittest discover -s tests -p "test_*.py"
          else
            python -m unittest discover -s tests -p "test_*.py"
          fi

      - name: Scan tracked content and added history
        run: python scripts/check_public_safety.py

      - name: Validate closed migration manifests
        env:
          BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: python scripts/validate_manifests.py --base-ref "$BASE_SHA"

      - name: Validate immutable batch receipt seals
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ steps.authority.outputs.head_sha }}
          BASE_SHA: ${{ steps.authority.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          legacy_context=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- ledger/receipts/batches)"
            legacy_context=true
          elif [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == controller/evaluation-* ]]; then
            expected=$(printf '%s\n' README.md analysis/model-recommendation.json evaluations.jsonl scorecard.md | sort)
            actual=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
            test "$actual" = "$expected"
            legacy_context=true
          elif [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == "controller/ledger-maintenance-086-luna-evaluation-schema" ]]; then
            expected=$(printf '%s\n' .github/workflows/ci.yml .github/workflows/public-safety.yml schema/evaluation.schema.json | sort)
            actual=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
            test "$actual" = "$expected"
            legacy_context=true
          elif [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == controller/ledger-maintenance-* ]]; then
            expected=$(printf '%s\n' .github/workflows/ci.yml .github/workflows/public-safety.yml tests/test_controller_maintenance.py | sort)
            actual=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
            test "$actual" = "$expected"
            legacy_context=true
          fi
          if [[ "$legacy_context" == true ]]; then
            GITHUB_EVENT_NAME=push GITHUB_REF_NAME=main python scripts/validate_receipts.py --mode pr --authority-sha "$HEAD_SHA" --validation-level source-replay
          else
            python scripts/validate_receipts.py --mode pr --authority-sha "$HEAD_SHA" --validation-level source-replay
          fi

      - name: Verify append-only source and generated views
        env:
          BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: python scripts/rebuild_views.py --check --base-ref "$BASE_SHA"
