name: Public safety

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan public ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run public-safety regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Scan tracked content and added history
        run: python scripts/check_public_safety.py

      - name: Validate closed migration manifests
        run: python scripts/validate_manifests.py

      - name: Validate immutable batch receipt seals
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RAW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/validate_receipts.py --mode pr --authority-sha "$RAW_HEAD_SHA"
          else
            python scripts/validate_receipts.py --mode canonical-main --authority-sha "$PUSH_SHA"
          fi

      - name: Verify append-only source and generated views
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/rebuild_views.py --check --base-ref "$BASE_SHA"
          else
            python scripts/rebuild_views.py --check
          fi
