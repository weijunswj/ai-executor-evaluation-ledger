name: Public safety

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-reviewed-backlog:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'controller/run-reviewed-ledger-backlog' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact authorised ledger main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 729198bc0750cc5585a72200eb7ebc7a8d811739

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify main and create final branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "729198bc0750cc5585a72200eb7ebc7a8d811739"
          git switch -c controller/final-ledger-backlog-20260725

      - name: Append sealed reviewed records and policy
        run: python scripts/controller_append_opus5_am6.py

      - name: Restore trusted workflows and remove recovery residue
        shell: bash
        run: |
          set -euo pipefail
          git checkout 3a35a61cb1c5509c1fc743cb67b8a6bf58156413 -- \
            .github/workflows/public-safety.yml \
            .github/workflows/rebuild-ledger-views.yml \
            CONTROLLER_QUICKSTART.md
          git rm -f scripts/controller_append_opus5_am6.py
          git rm -f scripts/controller_recovery_trigger.py
          git rm -f .github/workflows/finalize-am6-recovery.yml

      - name: Rebuild deterministic views
        run: python scripts/rebuild_views.py

      - name: Scan public ledger
        run: python scripts/check_public_safety.py

      - name: Verify append-only state and expected records
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check
          test "$(wc -l < evaluations.jsonl)" -eq 29
          test "$(grep -c '2026-07-25-claude-opus-5-max-business-automation-a-amendment-006' evaluations.jsonl)" -eq 1
          test "$(grep -c '2026-07-25-mimo-2-5-pro-private-quote-service-a-configuration-admission-amendment-006' evaluations.jsonl)" -eq 1
          test "$(grep -c '2026-07-25-mimo-2-5-pro-governance-tooling-a-amendment-003' evaluations.jsonl)" -eq 1

      - name: Commit and push clean final branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add -A
          git commit -m "Record reviewed evaluation backlog"
          git push origin HEAD:controller/final-ledger-backlog-20260725

  scan:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'controller/run-reviewed-ledger-backlog' ||
      github.actor == 'github-actions[bot]'
    name: Scan public ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked content and added history
        run: python scripts/check_public_safety.py

      - name: Verify append-only source and generated views
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/rebuild_views.py --check --base-ref "$BASE_SHA"
          else
            python scripts/rebuild_views.py --check
          fi
