name: Public safety

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Diagnostic ledger validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Diagnose append-only source and generated views
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/rebuild_views.py --check --base-ref "$BASE_SHA"

      - name: Scan tracked content and added history
        run: python3 scripts/check_public_safety.py
