name: Rebuild ledger views

on:
  push:
    branches:
      - "controller/**"
    paths:
      - evaluations.jsonl
      - model-policy.md
      - scripts/rebuild_views.py
      - README.md
      - scorecard.md
      - CONTROLLER_QUICKSTART.md
      - .github/workflows/rebuild-ledger-views.yml

permissions:
  contents: write

concurrency:
  group: rebuild-ledger-views-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply controller-owned evaluation
        env:
          RECORD_B64: ""
          POLICY_B64: ""
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import re

          run_id = "2026-07-26-claude-opus-5-business-automation-a-architecture-reset-008"
          record = base64.b64decode(__import__("os").environ["RECORD_B64"]).decode("utf-8")
          ledger = pathlib.Path("evaluations.jsonl")
          text = ledger.read_text(encoding="utf-8")
          if run_id not in text:
              with ledger.open("a", encoding="utf-8", newline="\n") as handle:
                  if text and not text.endswith("\n"):
                      handle.write("\n")
                  handle.write(record + "\n")

          section = base64.b64decode(__import__("os").environ["POLICY_B64"]).decode("utf-8")
          policy = pathlib.Path("model-policy.md")
          policy_text = policy.read_text(encoding="utf-8")
          policy_text = re.sub(
              r"^Updated: .*?$",
              "Updated: 26 July 2026, 01:49 SGT",
              policy_text,
              count=1,
              flags=re.MULTILINE,
          )
          if "## Claude Opus 5\n" not in policy_text:
              marker = "## Claude Opus 5 Max"
              if marker not in policy_text:
                  raise SystemExit("Claude Opus 5 Max insertion marker missing")
              policy_text = policy_text.replace(marker, section.rstrip() + "\n\n" + marker, 1)
          policy.write_text(policy_text, encoding="utf-8", newline="\n")
          PY

      - name: Rebuild generated views
        run: python scripts/rebuild_views.py

      - name: Restore canonical workflow
        shell: bash
        run: git checkout origin/main -- .github/workflows/rebuild-ledger-views.yml

      - name: Commit controller update when changed
        shell: bash
        run: |
          if git diff --quiet -- evaluations.jsonl model-policy.md README.md scorecard.md .github/workflows/rebuild-ledger-views.yml; then
            echo "Controller update already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add evaluations.jsonl model-policy.md README.md scorecard.md .github/workflows/rebuild-ledger-views.yml
          git commit -m "Append evaluation: Claude Opus 5 architecture reset"
          git push
