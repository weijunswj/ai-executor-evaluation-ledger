name: Rebuild ledger views

on:
  push:
    branches:
      - "controller/**"
    paths:
      - evaluations.jsonl
      - scripts/rebuild_views.py
      - README.md
      - scorecard.md
      - CONTROLLER_QUICKSTART.md
      - .github/workflows/rebuild-ledger-views.yml

permissions:
  contents: write

concurrency:
  group: rebuild-ledger-views-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correct reasoning label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("evaluations.jsonl")
          text = path.read_text(encoding="utf-8")
          run_id = "2026-07-26-claude-opus-5-business-automation-a-architecture-reset-008"
          target = '"requested_reasoning_level":"Sol XHIgh"'
          replacement = '"requested_reasoning_level":"Sol XHigh"'
          matching = [line for line in text.splitlines() if run_id in line]
          if len(matching) != 1:
              raise SystemExit(f"expected one target run, found {len(matching)}")
          if target not in matching[0]:
              raise SystemExit("target reasoning label not found on exact run")
          text = text.replace(target, replacement, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Rebuild generated views
        run: python scripts/rebuild_views.py

      - name: Restore canonical workflow
        shell: bash
        run: git checkout origin/main -- .github/workflows/rebuild-ledger-views.yml

      - name: Commit corrected controller update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add evaluations.jsonl README.md scorecard.md .github/workflows/rebuild-ledger-views.yml
          git commit -m "Correct architecture reasoning label"
          git push
