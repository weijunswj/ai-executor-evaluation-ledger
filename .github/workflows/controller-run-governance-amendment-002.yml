name: Run governance Amendment 1 ledger insertion

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  insert:
    if: github.head_ref == 'controller/ledger-governance-amendment-002' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller/ledger-governance-amendment-002
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply sealed packet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          record_path = Path('.controller/governance-amendment-002-record.json')
          record = json.loads(record_path.read_text(encoding='utf-8'))
          compact = json.dumps(record, separators=(',', ':'), ensure_ascii=False)

          ledger = Path('evaluations.jsonl')
          existing = ledger.read_text(encoding='utf-8')
          if record['run_id'] in existing:
              raise SystemExit('run ID already exists')
          ledger.write_text(existing.rstrip('\n') + '\n' + compact + '\n', encoding='utf-8', newline='\n')

          section = Path('.controller/governance-amendment-002-policy.md').read_text(encoding='utf-8')
          policy = Path('model-policy.md')
          text = policy.read_text(encoding='utf-8')
          start = text.index('## Xiaomi MiMo 2.5 Pro')
          end = text.index('## Claude Opus 4.8 High')
          text = text[:start] + section + text[end:]
          lines = text.splitlines()
          for index, line in enumerate(lines):
              if line.startswith('Updated: '):
                  lines[index] = 'Updated: 25 July 2026, 15:27 SGT'
                  break
          else:
              raise SystemExit('model policy Updated line missing')
          policy.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

          rm -f .controller/governance-amendment-002-record.json
          rm -f .controller/governance-amendment-002-policy.md
          rmdir .controller
          rm -f .github/workflows/controller-append-governance-amendment-002.yml
          rm -f .github/workflows/controller-run-governance-amendment-002.yml

          python scripts/rebuild_views.py
          python scripts/check_public_safety.py
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check

      - name: Commit controller administration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record governance Amendment 1 evaluation'
          git push origin HEAD:controller/ledger-governance-amendment-002
