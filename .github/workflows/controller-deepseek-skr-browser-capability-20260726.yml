name: Finalize DeepSeek SKR browser capability evaluation

on:
  push:
    branches:
      - main
    paths:
      - scripts/controller_append_deepseek_skr_browser_capability_20260726.py

permissions:
  contents: write

concurrency:
  group: controller-deepseek-skr-browser-capability-20260726
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build clean final evaluation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          final_branch="controller/final-deepseek-skr-browser-capability-20260726"
          if git ls-remote --exit-code --heads origin "refs/heads/${final_branch}" >/dev/null 2>&1; then
            echo "Final branch already exists; refusing duplicate publication." >&2
            exit 1
          fi
          git switch -c "${final_branch}" origin/main
          python scripts/controller_append_deepseek_skr_browser_capability_20260726.py
          git rm -- scripts/controller_append_deepseek_skr_browser_capability_20260726.py .github/workflows/controller-deepseek-skr-browser-capability-20260726.yml
          python scripts/rebuild_views.py
          python scripts/check_public_safety.py
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          run_id = "2026-07-26-deepseek-v4-pro-public-web-app-a-browser-capability-003"
          records = []
          for line in Path("evaluations.jsonl").read_text(encoding="utf-8").splitlines():
              if line.strip():
                  record = json.loads(line)
                  if record.get("run_id") == run_id:
                      records.append(record)
          if len(records) != 1:
              raise SystemExit(f"Expected one record, found {len(records)}")
          record = records[0]
          if record.get("provider") != "DeepSeek" or record.get("model") != "DeepSeek V4 Pro":
              raise SystemExit("Identity mismatch")
          if record.get("outcome") != "accepted" or record.get("weighted_score_5") != 4.85:
              raise SystemExit("Verdict or score mismatch")
          forbidden = {
              "requested_reasoning_level", "canonical_reasoning_level",
              "requested_provider_reasoning_mode", "observed_reasoning_mode",
              "observed_provider_reasoning_mode", "reasoning_mode_exposed",
          }
          leaked = forbidden.intersection(record)
          if leaked:
              raise SystemExit(f"Reasoning fields present: {sorted(leaked)}")
          PY
          test ! -e scripts/controller_append_deepseek_skr_browser_capability_20260726.py
          test ! -e .github/workflows/controller-deepseek-skr-browser-capability-20260726.yml
          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add -A
          git commit -m "Record DeepSeek SKR browser capability evaluation"
          git push origin "HEAD:${final_branch}"
