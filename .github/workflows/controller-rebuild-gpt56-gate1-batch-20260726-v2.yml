name: Rebuild GPT-5.6 Sol Gate 1 evaluations v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/controller-rebuild-gpt56-gate1-batch-20260726-v2.yml

permissions:
  contents: write

concurrency:
  group: controller-rebuild-gpt56-gate1-batch-20260726-v2
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'controller/rebuild-gpt56-gate1-batch-20260726-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build clean current-main final branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main controller/trigger-gpt56-gate1-batch-20260726
          final_branch="controller/final-gpt56-gate1-batch-20260726-v2"
          if git ls-remote --exit-code --heads origin "refs/heads/${final_branch}" >/dev/null 2>&1; then
            echo "Final branch already exists; refusing duplicate publication." >&2
            exit 1
          fi
          git show "origin/controller/trigger-gpt56-gate1-batch-20260726:scripts/controller_append_gpt56_gate1_batch_20260726.py" > /tmp/controller_append_gpt56_gate1_batch_20260726.py
          git switch -c "${final_branch}" origin/main
          cp /tmp/controller_append_gpt56_gate1_batch_20260726.py scripts/controller_append_gpt56_gate1_batch_20260726.py
          python scripts/controller_append_gpt56_gate1_batch_20260726.py
          rm -- scripts/controller_append_gpt56_gate1_batch_20260726.py
          python scripts/rebuild_views.py
          python scripts/check_public_safety.py
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "2026-07-26-gpt-5-6-sol-workflow-compatibility-gate1-amendment-001": ("GPT-5.6 Sol", "accepted", 4.73, "research", "high"),
              "2026-07-26-gpt-5-6-sol-external-control-plane-gate1-amendment-001": ("GPT-5.6 Sol", "amend", 4.09, "research", "high"),
          }
          records = [json.loads(line) for line in Path("evaluations.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          forbidden = {
              "requested_reasoning_level", "canonical_reasoning_level",
              "requested_provider_reasoning_mode", "observed_reasoning_mode",
              "observed_provider_reasoning_mode", "reasoning_mode_exposed",
          }
          for run_id, (model, outcome, score, task_class, difficulty) in expected.items():
              matches = [record for record in records if record.get("run_id") == run_id]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one record for {run_id}, found {len(matches)}")
              record = matches[0]
              if record.get("provider") != "OpenAI" or record.get("model") != model:
                  raise SystemExit(f"Identity mismatch for {run_id}")
              if record.get("outcome") != outcome or record.get("weighted_score_5") != score:
                  raise SystemExit(f"Verdict or score mismatch for {run_id}")
              if record.get("task_class") != task_class or record.get("difficulty") != difficulty:
                  raise SystemExit(f"Task metadata mismatch for {run_id}")
              leaked = forbidden.intersection(record)
              if leaked:
                  raise SystemExit(f"Reasoning fields present for {run_id}: {sorted(leaked)}")
          PY
          test ! -e scripts/controller_append_gpt56_gate1_batch_20260726.py
          test ! -e .github/workflows/controller-rebuild-gpt56-gate1-batch-20260726-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add -A
          git commit -m "Record GPT-5.6 Sol Gate 1 amendment evaluations"
          git push origin "HEAD:${final_branch}"
