name: Controller rebuild zero-run summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.head_ref == 'controller/hide-zero-run-models'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller/hide-zero-run-models
          fetch-depth: 0
      - name: Rebuild and verify ledger views
        run: |
          python scripts/rebuild_views.py
          python scripts/rebuild_views.py --check
          python scripts/check_public_safety.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/controller-rebuild-zero-run-models.yml
      - name: Commit generated views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scorecard.md .github/workflows/controller-rebuild-zero-run-models.yml
          git commit -m "Regenerate summaries without zero-run models"
          git push
