name: Finalize DeepSeek DL-299-310-002 implementation evaluation

on:
  push:
    branches:
      - controller/intake-deepseek-dl299-310-002-implementation-001
    paths:
      - scripts/controller_intake_deepseek_dl299_310_002_implementation_001.py
      - .github/workflows/controller-intake-deepseek-dl299-310-002-implementation-001.yml

permissions:
  contents: write

concurrency:
  group: controller-intake-deepseek-dl299-310-002-implementation-001
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controller intake branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: controller/intake-deepseek-dl299-310-002-implementation-001

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Append reviewed evaluation
        run: python scripts/controller_intake_deepseek_dl299_310_002_implementation_001.py

      - name: Rebuild and validate ledger
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_views.py
          python scripts/check_public_safety.py
          python scripts/rebuild_views.py --check
          git diff --check
          test "$(grep -c '2026-07-26-deepseek-v4-pro-governance-tooling-a-dl-299-310-002-implementation-001' evaluations.jsonl)" -eq 1

      - name: Remove temporary intake runner and publish final branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -- \
            scripts/controller_intake_deepseek_dl299_310_002_implementation_001.py \
            .github/workflows/controller-intake-deepseek-dl299-310-002-implementation-001.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'ledger-controller'
          git add evaluations.jsonl README.md scorecard.md
          git commit -m 'Record DeepSeek DL-299-310-002 implementation evaluation'
          git push origin HEAD:controller/intake-deepseek-dl299-310-002-implementation-001
