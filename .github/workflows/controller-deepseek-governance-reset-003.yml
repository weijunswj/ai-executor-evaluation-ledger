name: Finalize DeepSeek governance reset 003 evaluation

on:
  issue_comment:
    types:
      - created
  push:
    branches:
      - main

permissions:
  contents: write
  issues: read

concurrency:
  group: controller-deepseek-governance-reset-003
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.number == 43 && contains(github.event.comment.body, '[run-deepseek-governance-reset-003]')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-deepseek-governance-reset-003]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build clean final evaluation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          final_branch="controller/final-deepseek-governance-reset-003-20260726"
          if git ls-remote --exit-code --heads origin "refs/heads/${final_branch}" >/dev/null 2>&1; then
            echo "Final evaluation branch already exists; refusing duplicate publication." >&2
            exit 1
          fi

          git switch -c "${final_branch}" origin/main
          python scripts/controller_append_deepseek_governance_reset_003.py

          git rm -- \
            scripts/controller_append_deepseek_governance_reset_003.py \
            scripts/controller_deepseek_governance_reset_003.trigger \
            .github/workflows/controller-deepseek-governance-reset-003.yml

          python scripts/rebuild_views.py
          python scripts/check_public_safety.py
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check

          test "$(grep -c '2026-07-26-deepseek-v4-pro-governance-tooling-a-architecture-reset-003' evaluations.jsonl)" -eq 1
          test ! -e scripts/controller_append_deepseek_governance_reset_003.py
          test ! -e scripts/controller_deepseek_governance_reset_003.trigger
          test ! -e .github/workflows/controller-deepseek-governance-reset-003.yml

          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add -A
          git commit -m "Record final DeepSeek governance architecture evaluation"
          git push origin "HEAD:${final_branch}"
