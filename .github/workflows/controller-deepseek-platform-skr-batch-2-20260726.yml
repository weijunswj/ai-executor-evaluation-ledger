name: Finalize second DeepSeek Platform and SKR evaluation batch

on:
  push:
    branches:
      - main
    paths:
      - scripts/controller_append_deepseek_platform_skr_batch_2_20260726.py
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/controller_append_deepseek_platform_skr_batch_2_20260726.py

permissions:
  contents: write

concurrency:
  group: controller-deepseek-platform-skr-batch-2-20260726
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'controller/trigger-deepseek-platform-skr-batch-2-20260726')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build clean final evaluation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          final_branch="controller/final-deepseek-platform-skr-batch-2-20260726"
          if git ls-remote --exit-code --heads origin "refs/heads/${final_branch}" >/dev/null 2>&1; then
            echo "Final branch already exists; refusing duplicate publication." >&2
            exit 1
          fi
          git switch -c "${final_branch}" origin/main
          python scripts/controller_append_deepseek_platform_skr_batch_2_20260726.py
          git rm -- scripts/controller_append_deepseek_platform_skr_batch_2_20260726.py .github/workflows/controller-deepseek-platform-skr-batch-2-20260726.yml
          python scripts/rebuild_views.py
          python scripts/check_public_safety.py
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "2026-07-26-deepseek-v4-pro-shared-platform-a-canonical-operator-source-003": ("accepted", 4.65),
              "2026-07-26-deepseek-v4-pro-public-web-app-a-http-walkthrough-002": ("amend", 3.15),
          }
          forbidden = {
              "requested_reasoning_level", "canonical_reasoning_level",
              "requested_provider_reasoning_mode", "observed_reasoning_mode",
              "observed_provider_reasoning_mode", "reasoning_mode_exposed",
          }
          matches = {key: [] for key in expected}
          for line in Path("evaluations.jsonl").read_text(encoding="utf-8").splitlines():
              if line.strip():
                  record = json.loads(line)
                  if record.get("run_id") in matches:
                      matches[record["run_id"]].append(record)
          for run_id, records in matches.items():
              if len(records) != 1:
                  raise SystemExit(f"Expected one record for {run_id}, found {len(records)}")
              record = records[0]
              outcome, score = expected[run_id]
              if record.get("provider") != "DeepSeek" or record.get("model") != "DeepSeek V4 Pro":
                  raise SystemExit(f"Identity mismatch for {run_id}")
              if record.get("outcome") != outcome or record.get("weighted_score_5") != score:
                  raise SystemExit(f"Verdict or score mismatch for {run_id}")
              leaked = forbidden.intersection(record)
              if leaked:
                  raise SystemExit(f"Reasoning fields present for {run_id}: {sorted(leaked)}")
          PY
          test ! -e scripts/controller_append_deepseek_platform_skr_batch_2_20260726.py
          test ! -e .github/workflows/controller-deepseek-platform-skr-batch-2-20260726.yml
          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add -A
          git commit -m "Record second DeepSeek Platform and SKR evaluations"
          git push origin "HEAD:${final_branch}"
