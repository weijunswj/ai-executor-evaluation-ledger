name: Finalize Swooshz evaluations from current main

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/controller_append_swooshz_evaluations_20260726.py

permissions:
  contents: write

concurrency:
  group: controller-swooshz-current-main-runner-20260726
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'controller/trigger-swooshz-evaluations-20260726-03'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build clean current-main evaluation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          final_branch="controller/ready-swooshz-evaluations-20260726-v2"
          if git ls-remote --exit-code --heads origin "refs/heads/${final_branch}" >/dev/null 2>&1; then
            echo "Ready branch already exists; refusing duplicate publication." >&2
            exit 1
          fi
          git switch -c "${final_branch}" origin/main
          python scripts/controller_append_swooshz_evaluations_20260726.py
          git rm -- \
            scripts/controller_append_swooshz_evaluations_20260726.py \
            .github/workflows/controller-swooshz-evaluations-20260726.yml \
            .github/workflows/controller-swooshz-evaluations-pr-fallback-20260726.yml \
            .github/workflows/controller-swooshz-current-main-runner-20260726.yml
          python scripts/rebuild_views.py
          python scripts/check_public_safety.py
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "2026-07-26-gpt-5-6-sol-public-web-app-a-rendered-walkthrough-004": ("OpenAI", "GPT-5.6 Sol", "amend", 4.20),
              "2026-07-26-deepseek-v4-pro-private-quote-service-a-role-design-amendment-002": ("DeepSeek", "DeepSeek V4 Pro", "amend", 3.48),
              "2026-07-26-deepseek-v4-pro-shared-platform-a-hostname-contract-repair-005": ("DeepSeek", "DeepSeek V4 Pro", "amend", 3.49),
          }
          records = [json.loads(line) for line in Path("evaluations.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          forbidden = {
              "requested_reasoning_level", "canonical_reasoning_level",
              "requested_provider_reasoning_mode", "observed_reasoning_mode",
              "observed_provider_reasoning_mode", "reasoning_mode_exposed",
          }
          for run_id, values in expected.items():
              matches = [record for record in records if record.get("run_id") == run_id]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one record for {run_id}, found {len(matches)}")
              record = matches[0]
              if (record.get("provider"), record.get("model"), record.get("outcome"), record.get("weighted_score_5")) != values:
                  raise SystemExit(f"Identity or result mismatch for {run_id}")
              leaked = forbidden.intersection(record)
              if leaked:
                  raise SystemExit(f"Reasoning fields present for {run_id}: {sorted(leaked)}")
          PY
          test ! -e scripts/controller_append_swooshz_evaluations_20260726.py
          test ! -e .github/workflows/controller-swooshz-evaluations-20260726.yml
          test ! -e .github/workflows/controller-swooshz-evaluations-pr-fallback-20260726.yml
          test ! -e .github/workflows/controller-swooshz-current-main-runner-20260726.yml
          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add -A
          git commit -m "Record pending Swooshz evaluations from current main"
          git push origin "HEAD:${final_branch}"
