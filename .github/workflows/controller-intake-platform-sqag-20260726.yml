# Controller trigger commit: execute the installed bounded intake.
name: Finalize Platform and SQAG evaluations 20260726

on:
  push:
    branches:
      - controller/intake-platform-sqag-20260726
    paths:
      - scripts/controller_intake_platform_sqag_20260726.py
      - .github/workflows/controller-intake-platform-sqag-20260726.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: controller-platform-sqag-evaluations-20260726
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out intake branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: controller/intake-platform-sqag-20260726

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build clean final branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/controller_intake_platform_sqag_20260726.py /tmp/controller_intake_platform_sqag_20260726.py
          git fetch origin main
          final_branch="controller/final-platform-sqag-evaluations-20260726"
          if git ls-remote --exit-code --heads origin "refs/heads/${final_branch}" >/dev/null 2>&1; then
            echo "Final branch already exists; refusing duplicate publication." >&2
            exit 1
          fi
          git switch -c "${final_branch}" origin/main
          python /tmp/controller_intake_platform_sqag_20260726.py
          python scripts/rebuild_views.py
          python scripts/check_public_safety.py
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "2026-07-26-deepseek-v4-pro-shared-platform-a-hostname-contract-amendment-006": ("DeepSeek V4 Pro", "Sol High", "standard-thinking", "accepted", 4.34),
              "2026-07-26-deepseek-v4-pro-private-quote-service-a-role-design-amendment-003": ("DeepSeek V4 Pro", "Sol XHigh", "not-exposed", "amend", 3.49),
          }
          records = [
              json.loads(line)
              for line in Path("evaluations.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          for run_id, values in expected.items():
              matches = [record for record in records if record.get("run_id") == run_id]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one record for {run_id}, found {len(matches)}")
              record = matches[0]
              actual = (
                  record.get("model"),
                  record.get("requested_reasoning_level"),
                  record.get("observed_reasoning_mode"),
                  record.get("outcome"),
                  record.get("weighted_score_5"),
              )
              if actual != values:
                  raise SystemExit(f"Identity or result mismatch for {run_id}: {actual!r}")
          PY
          test ! -e scripts/controller_intake_platform_sqag_20260726.py
          test ! -e .github/workflows/controller-intake-platform-sqag-20260726.yml
          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add evaluations.jsonl README.md scorecard.md
          git commit -m "Record Platform and SQAG evaluations"
          git push origin "HEAD:${final_branch}"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${final_branch}" \
            --title "Record Platform and SQAG evaluations" \
            --body "Append two independently reviewed public-safe evaluations, rebuild deterministic views, and preserve the controller-only append boundary. No model-policy boundary changes are required. Merge only after exact-head Public Safety and required checks pass."
