name: Finalize Platform and SQAG evaluations 20260726

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/controller_intake_platform_sqag_20260726.py

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: controller-platform-sqag-evaluations-20260726
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'controller/trigger-platform-sqag-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify final branch is absent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          final_branch="controller/final-platform-sqag-evaluations-20260726-v2"
          if git ls-remote --exit-code --heads origin "refs/heads/${final_branch}" >/dev/null 2>&1; then
            echo "Final branch already exists; refusing duplicate publication." >&2
            exit 1
          fi

      - name: Create final branch from current main
        run: git switch -c controller/final-platform-sqag-evaluations-20260726-v2 origin/main

      - name: Append reviewed evaluation records
        run: python scripts/controller_intake_platform_sqag_20260726.py

      - name: Remove temporary intake authority
        run: git rm -- scripts/controller_intake_platform_sqag_20260726.py .github/workflows/controller-intake-platform-sqag-20260726.yml

      - name: Rebuild deterministic views
        run: python scripts/rebuild_views.py

      - name: Run public-safety scan
        run: python scripts/check_public_safety.py

      - name: Verify append-only source and generated views
        run: |
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check

      - name: Verify exact evaluation identities and results
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "2026-07-26-deepseek-v4-pro-shared-platform-a-hostname-contract-amendment-006": ("DeepSeek V4 Pro", "Sol High", "standard-thinking", "accepted", 4.34),
              "2026-07-26-deepseek-v4-pro-private-quote-service-a-role-design-amendment-003": ("DeepSeek V4 Pro", "Sol XHigh", "not-exposed", "amend", 3.49),
          }
          records = [
              json.loads(line)
              for line in Path("evaluations.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          for run_id, values in expected.items():
              matches = [record for record in records if record.get("run_id") == run_id]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one record for {run_id}, found {len(matches)}")
              record = matches[0]
              actual = (
                  record.get("model"),
                  record.get("requested_reasoning_level"),
                  record.get("observed_reasoning_mode"),
                  record.get("outcome"),
                  record.get("weighted_score_5"),
              )
              if actual != values:
                  raise SystemExit(f"Identity or result mismatch for {run_id}: {actual!r}")
          PY
          test ! -e scripts/controller_intake_platform_sqag_20260726.py
          test ! -e .github/workflows/controller-intake-platform-sqag-20260726.yml

      - name: Publish final branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add -A
          git commit -m "Record Platform and SQAG evaluations"
          final_branch="controller/final-platform-sqag-evaluations-20260726-v2"
          git push origin "HEAD:${final_branch}"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${final_branch}" \
            --title "Record Platform and SQAG evaluations" \
            --body "Append two independently reviewed public-safe evaluations on exact current main, rebuild deterministic views, and remove the temporary intake authority. No model-policy boundary changes are required. Merge only after exact-head Public Safety and required checks pass."
