name: Finalize Amendment 6 ledger recovery

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  recover:
    if: contains(github.event.head_commit.message, '[run-am6-recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build clean recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -c controller/final-opus5-am6-recovery-v2

          python scripts/controller_append_opus5_am6.py

          git checkout 3a35a61cb1c5509c1fc743cb67b8a6bf58156413 -- \
            .github/workflows/public-safety.yml \
            .github/workflows/rebuild-ledger-views.yml \
            CONTROLLER_QUICKSTART.md
          git rm -f scripts/controller_append_opus5_am6.py
          git rm -f scripts/controller_recovery_trigger.py
          git rm -f .github/workflows/finalize-am6-recovery.yml

          python scripts/rebuild_views.py
          python scripts/check_public_safety.py
          python scripts/rebuild_views.py --check --base-ref origin/main
          git diff --check

          test "$(grep -c '2026-07-25-claude-opus-5-max-business-automation-a-amendment-006' evaluations.jsonl)" -eq 1

          git config user.name "github-actions[bot]"
          git config user.email "ledger-controller"
          git add -A
          git commit -m "Recover and record Opus 5 Max Amendment 6 evaluation"
          git push --force-with-lease origin HEAD:controller/final-opus5-am6-recovery-v2
